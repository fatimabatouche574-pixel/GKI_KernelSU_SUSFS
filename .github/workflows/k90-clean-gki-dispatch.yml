name: K90 Official KernelSU Built-in 4K
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/k90-clean-gki-dispatch.yml
      - .github/scripts/k90-*
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k90-clean-gki
  cancel-in-progress: false
env:
  kernel_build_version: 6.6.x-android15
  os_patch_level: 2026-01
  root_flavor: KernelSU
  brand_name: K90-KernelSU
  bypass: 'false'
  use_susfs: 'false'
  use_nomount: 'false'
  use_bbg: 'false'
  use_net: 'false'
  use_ds: 'false'
  use_ntsync: 'false'
  use_ptrace: 'false'
  use_unicode: 'false'
  use_bpf: 'false'
  use_perf: 'false'
  KSU_COMMIT: 3c1240625655978f319a98398031100b80e9da7c
  AK3_COMMIT: 020dfeccf9d7e962a48400fc94d3e451df92eead
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y git curl python3 zip unzip flex bison libssl-dev libelf-dev bc
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/k90.swap
          sudo chmod 600 /mnt/k90.swap
          sudo mkswap /mnt/k90.swap
          sudo swapon /mnt/k90.swap
          mkdir -p kernel git-repo evidence delivery
          curl -fL --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o git-repo/repo
          chmod +x git-repo/repo
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
      - name: Sync exact Google GKI baseline
        uses: ./.github/actions/download-kernel
        with:
          version: android15-6.6
          android_version: android15
          kernel_version: '6.6'
          os_patch_level: '2026-01'
      - name: Verify baseline before integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/k90-verify.py baseline
          git -C kernel/common rev-parse HEAD > evidence/kernel-source-commit.txt
          (cd kernel && repo manifest -r) > evidence/manifest.xml
          cp kernel/common/arch/arm64/configs/gki_defconfig evidence/google-gki_defconfig
      - name: Integrate pinned official KernelSU source
        uses: ./.github/actions/root-setup
        with:
          flavor: kernelsu
          commit: ${{ env.KSU_COMMIT }}
      - name: Configure and verify before compile
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/k90-verify.py configure
          cd kernel
          tools/bazel build --jobs=2 //common:kernel_aarch64_config 2>&1 | tee ../evidence/configure.log
          cd ..
          python3 .github/scripts/k90-verify.py prebuild
      - name: Compile official KernelSU into GKI Image
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          tools/bazel build --jobs=2 //common:kernel_aarch64 2>&1 | tee ../evidence/build.log
      - name: Verify Image and package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          git -C AnyKernel3 checkout --detach "$AK3_COMMIT"
          test "$(git -C AnyKernel3 rev-parse HEAD)" = "$AK3_COMMIT"
          python3 .github/scripts/k90-verify.py package
      - name: Upload verified flash ZIP
        uses: actions/upload-artifact@v4
        with:
          name: K90-6.6.118-android15-KernelSU-built-in-4k-AnyKernel3
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K90-build-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
