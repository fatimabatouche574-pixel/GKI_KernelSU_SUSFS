name: K90 Clean GKI Dispatch

# retrigger: susfs stable-pershoot patch fix v2
permissions:
  actions: write
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/k90-clean-gki-dispatch.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch clean Android 15 6.6.118 GKI build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering K90 clean GKI build"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/main.yml/dispatches" \
            -d @- <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_type": "Action",
              "use_cache": "true",
              "bypass": "false",
              "kernel_build_version": "6.6.x-android15",
              "os_patch_level": "2026-01",
              "brand_name": "K90Clean",
              "commit_mode": "verified",
              "root_flavor": "KernelSU-Next",
              "use_susfs": "true",
              "use_nomount": "false",
              "use_bbg": "false",
              "use_net": "false",
              "use_ds": "false",
              "use_ntsync": "false",
              "use_ptrace": "false",
              "use_unicode": "false",
              "use_bpf": "false",
              "use_perf": "false",
              "test_release_notes": "false"
            }
          }
          JSON
