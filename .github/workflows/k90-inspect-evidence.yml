name: K90 Inspect Build Evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/k90-inspect-evidence.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run to inspect
        default: '34861611549'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect saved Kleaf source from failed build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || '34861611549' }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name K90-build-evidence --dir evidence
          python3 - <<'PY'
          from pathlib import Path
          p = Path("evidence/common_kernels.original.bzl")
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if "check_defconfig" in line or "def _define_common_kernel" in line or "kernel_build(" in line:
                  print("\n".join(f"{j+1}: {lines[j]}" for j in range(max(0,i-5),min(len(lines),i+55))))
          print(Path("evidence/manifest.xml").read_text())
          PY
