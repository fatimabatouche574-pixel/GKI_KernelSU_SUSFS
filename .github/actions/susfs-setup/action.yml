name: 'Setup SUSFS Branch'
description: 'Clone SUSFS repo and apply the last known pershoot integration patches'
inputs:
  susfs_commit:
    description: 'SUSFS commit hash (empty = latest on auto-derived gki-{version} branch)'
    required: false
    default: ""
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Clone SUSFS Branch
      shell: bash
      run: |
        set -euo pipefail

        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        SUSFS_BRANCH="gki-${{ inputs.version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
        PATCH_BASE="https://raw.githubusercontent.com/WildKernels/kernel_patches/757201d1591dfd857a1195b7accb1a8203b18793/pershoot/susfs4ksu"

        echo "Preparing SUSFS for branch: $SUSFS_BRANCH"
        echo "Cloning base SUSFS from $SUSFS_REPO..."
        retry git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu

        if [ -n "${{ inputs.susfs_commit }}" ]; then
          echo "Checking out SUSFS commit: ${{ inputs.susfs_commit }}"
          retry git -C "${{ github.workspace }}/susfs4ksu" checkout "${{ inputs.susfs_commit }}"
        fi

        cd "${{ github.workspace }}/susfs4ksu"
        SUSFS_COMMIT="$(git rev-parse HEAD)"
        echo "SUSFS_COMMIT=$SUSFS_COMMIT" >> "$GITHUB_ENV"
        echo "Using base SUSFS commit: $SUSFS_COMMIT"

        # WildKernels/kernel_patches removed these files in commit 4285cd1 with
        # the intention of replacing them with live pershoot commits. The
        # pershoot mirror does not expose gki-android15-6.6, so use the exact
        # last known patch pair from the parent commit. Apply idempotently so a
        # future SUSFS tree that already carries them will simply skip them.
        PATCHES=(
          "0001-pershoot-Allow-core-to-be-built-with-no-features.patch"
          "0002-pershoot-Implement-SuSFS-and-Toolkit-coexistence.patch"
        )

        for patch_name in "${PATCHES[@]}"; do
          tmp_patch="$(mktemp)"
          echo "Fetching pershoot integration patch: $patch_name"
          retry curl -fsSL "$PATCH_BASE/$patch_name" -o "$tmp_patch"

          if patch --dry-run -p1 < "$tmp_patch" >/dev/null 2>&1; then
            echo "Applying $patch_name"
            patch -p1 < "$tmp_patch"
          elif patch --dry-run -R -p1 < "$tmp_patch" >/dev/null 2>&1; then
            echo "$patch_name is already integrated; skipping"
          else
            echo "ERROR: $patch_name neither applies nor appears already integrated" >&2
            echo "Dry-run diagnostics:" >&2
            patch --dry-run -p1 < "$tmp_patch" || true
            rm -f "$tmp_patch"
            exit 1
          fi

          rm -f "$tmp_patch"
        done

        echo "SUSFS integration tree prepared successfully."
