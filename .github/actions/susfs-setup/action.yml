name: 'Setup SUSFS Branch'
description: 'Clone SUSFS repo and cherry-pick live pershoot integration commits'
inputs:
  susfs_commit:
    description: 'SUSFS commit hash (empty = latest on auto-derived gki-{version} branch)'
    required: false
    default: ""
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Clone SUSFS Branch
      shell: bash
      run: |
        set -euo pipefail

        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        SUSFS_BRANCH="gki-${{ inputs.version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
        PERSHOOT_REPO="https://gitlab.com/pershoot/susfs4ksu.git"

        echo "Preparing SUSFS for branch: $SUSFS_BRANCH"
        echo "Cloning base SUSFS from $SUSFS_REPO..."
        retry git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu

        if [ -n "${{ inputs.susfs_commit }}" ]; then
          echo "Checking out SUSFS commit: ${{ inputs.susfs_commit }}"
          retry git -C "${{ github.workspace }}/susfs4ksu" checkout "${{ inputs.susfs_commit }}"
        fi

        cd "${{ github.workspace }}/susfs4ksu"
        SUSFS_COMMIT="$(git rev-parse HEAD)"
        echo "SUSFS_COMMIT=$SUSFS_COMMIT" >> "$GITHUB_ENV"
        echo "Using base SUSFS commit: $SUSFS_COMMIT"

        # WildKernels/kernel_patches removed the old pinned pershoot patch files
        # in 4285cd1755f62a20269aa80757ecb4631908ec77 with the note that GKI
        # should fetch the top two pershoot integration commits live. Do that
        # here so the workflow stays compatible with the current helper repo.
        echo "Fetching live pershoot integration commits for $SUSFS_BRANCH..."
        git remote remove pershoot 2>/dev/null || true
        git remote add pershoot "$PERSHOOT_REPO"
        retry git fetch --no-tags --depth=2 pershoot "$SUSFS_BRANCH"

        mapfile -t PERSHOOT_COMMITS < <(git rev-list --max-count=2 --reverse FETCH_HEAD)
        if [ "${#PERSHOOT_COMMITS[@]}" -ne 2 ]; then
          echo "ERROR: expected two pershoot integration commits, got ${#PERSHOOT_COMMITS[@]}" >&2
          exit 1
        fi

        echo "Applying pershoot commits: ${PERSHOOT_COMMITS[*]}"
        for commit in "${PERSHOOT_COMMITS[@]}"; do
          git cherry-pick "$commit"
        done

        echo "SUSFS integration tree prepared successfully."
